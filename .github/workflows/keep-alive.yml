name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"   # runs every 10 minutes
  workflow_dispatch:          # lets you manually trigger it from GitHub UI too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s -o /dev/null -w "%{http_code}" https://forgefit-uevt.onrender.com/